name: CI/CD Sentiment Model

on:
  push:
    branches: [ main, feature/ci-cd-pipeline ]
  pull_request:
    branches: [ main, feature/ci-cd-pipeline ]
  schedule:
    # automatic retraining
    - cron: '0 6 * * 1'  

permissions:
  contents: read
  id-token: write

jobs:
  build-and-train:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install transformers datasets evaluate huggingface_hub

      # Run a lightweight sanity test to ensure dataset and tokenizer load properly
      - name: Run sanity tests
        run: |
          python - <<'EOF'
          import pandas as pd
          from transformers import AutoTokenizer
          df = pd.read_csv("data/raw/social_sentiment.csv")
          assert not df.empty, "Dataset is empty!"
          tokenizer = AutoTokenizer.from_pretrained("cardiffnlp/twitter-roberta-base-sentiment-latest")
          print("Dataset and tokenizer loaded successfully.")
          EOF

      # Generate a model version tag based on timestamp
      - name: Set model version tag
        run: echo "MODEL_VERSION=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      # Train the sentiment model
      - name: Run model training
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python src/train.py

      # Run integration tests after training
      - name: Run integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/integration_test.py

      # Compare new model performance and push only if improved
      - name: Compare models and deploy if improved
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install evaluate datasets huggingface_hub transformers
          python src/model_compare.py

      # Upload trained model as a build artifact for inspection
      - name: Upload model artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: roberta_sentiment_model
          path: models/roberta_sentiment_model/

      # Push the improved model to Hugging Face Hub
      - name: Push promoted model to Hugging Face
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import login
          from transformers import AutoModelForSequenceClassification, AutoTokenizer

          login(token="${{ secrets.HF_TOKEN }}")

          repo_id = "CapDimble/sentiment-monitoring-model"
          model_dir = "models/roberta_sentiment_model"

          if os.path.exists(model_dir):
              print(f"Pushing model version ${{ env.MODEL_VERSION }} to Hugging Face Hub...")
              model = AutoModelForSequenceClassification.from_pretrained(model_dir)
              tokenizer = AutoTokenizer.from_pretrained(model_dir)
              model.push_to_hub(repo_id, commit_message=f"Auto-deploy {os.getenv('MODEL_VERSION')}")
              tokenizer.push_to_hub(repo_id)
              print(f"Model version {os.getenv('MODEL_VERSION')} successfully pushed to {repo_id}")
          else:
              print("No new model found for deployment — skipping push.")
          EOF