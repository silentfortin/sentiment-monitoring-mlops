name: CI/CD Sentiment Model

on:
  push:
    branches: [ main, feature/ci-cd-pipeline ]
  pull_request:
    branches: [ main, feature/ci-cd-pipeline ]

jobs:
  build-and-train:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install transformers datasets evaluate huggingface_hub

      # 4. Sanity test: dataset + tokenizer
      - name: Run sanity tests
        run: |
          python - <<'EOF'
          import pandas as pd
          df = pd.read_csv("data/raw/social_sentiment.csv")
          assert not df.empty, "Dataset is empty!"
          from transformers import AutoTokenizer
          tokenizer = AutoTokenizer.from_pretrained("cardiffnlp/twitter-roberta-base-sentiment-latest")
          print("✅ Dataset and tokenizer loaded successfully.")
          EOF

      # 5. Train model
      - name: Run model training
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python src/train.py

      # 6. Run integration tests (end-to-end)
      - name: Run integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests/integration_test.py

      # 7. Compare with production model on Hugging Face and update only if improved
      - name: Compare models and deploy if improved
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install evaluate datasets huggingface_hub transformers
          python src/model_compare.py

      # 8. Upload promoted model as an artifact
      - name: Upload promoted model artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: production_model
          path: models/production_model/

      # 9. Push promoted model to Hugging Face Hub (Continuous Deployment)
      - name: Push model to Hugging Face
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          from huggingface_hub import login
          from transformers import AutoModelForSequenceClassification, AutoTokenizer

          login(token="${{ secrets.HF_TOKEN }}")

          repo_id = "CapDimble/sentiment-monitoring-model"
          model_dir = "models/production_model"

          model = AutoModelForSequenceClassification.from_pretrained(model_dir)
          tokenizer = AutoTokenizer.from_pretrained(model_dir)

          model.push_to_hub(repo_id)
          tokenizer.push_to_hub(repo_id)

          print(f"✅ Production model successfully pushed to {repo_id}")
          EOF
